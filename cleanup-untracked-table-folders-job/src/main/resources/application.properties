quarkus.package.type=uber-jar
quarkus.banner.enabled=false
quarkus.log.level=INFO
quarkus.log.category."com.iomete".level=INFO

# Spark supplies Jackson, and its Scala module refuses a databind from another minor version.
quarkus.class-loading.removed-artifacts=com.fasterxml.jackson.core:jackson-core,com.fasterxml.jackson.core:jackson-databind,com.fasterxml.jackson.core:jackson-annotations

%dev.quarkus.log.category."com".level=INFO
