{
    # Database configuration - will be overridden by environment variables
    databases: {
      # Bundle database - where resource bundles and permissions are stored
      bundle_db: {
        host: "localhost"
        port: 5432
        name: "iomete_iam_db"
        user: ${?DB_USER}
        password: ${?DB_PASSWORD}
      }

      # Asset database - where namespaces and resources (lakehouse, spark_job, jupyter_container) are stored
      asset_db: {
        host: "localhost"
        port: 5432
        name: "iomete_core_db"
        user: ${?ASSET_DB_USER}
        password: ${?ASSET_DB_PASSWORD}
      }
    }

    # Migration configuration
    migration: {
        # List of domains to migrate
        domains: ["default"]

        # Resource tables to scan for namespace usage
        # These tables are queried to find users who have resources in each namespace
        resource_tables: [
            {
                table: "lakehouse"
                namespace_column: "namespace"
                user_columns: ["created_by"]  # List of user columns to check
            },
            {
                table: "spark_job"
                namespace_column: "namespace"
                user_columns: ["created_by", "job_user"]  # job_user is run_as_user for spark jobs
            },
            {
                table: "jupyter_container"
                namespace_column: "namespace"
                user_columns: ["created_by"]
            }
        ]

        # Permissions to grant to users on namespaces they use
        namespace_permissions: ["USE"]

        # Transaction settings
        batch_size: 1000
        retry_attempts: 3

        # Validation settings
        validate_before_migration: true
        dry_run: false

        # Debug mode - enables detailed logging and query output
        debug_mode: false

        # Duplicate bundle behavior: FAIL, SKIP, or UPDATE
        # FAIL: Stop execution if resource bundle already exists
        # SKIP: Skip migration for domains where bundle exists
        # UPDATE: Update existing bundle and re-process namespace permissions
        duplicate_bundle_action: "UPDATE"
    }

    # Namespace table configuration
    namespace_config: {
        table: "domain_namespace_mapping"
        id_column: "id"
        namespace_column: "namespace"
        domain_column: "domain_id"
    }
}
