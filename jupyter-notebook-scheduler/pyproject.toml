[project]
name = "jupyter-notebook-scheduler"
version = "0.1.0"
description = "Spark job to schedule and execute Jupyter Notebooks"
authors = [
    {name = "IOMETE"}
]
package-mode = false
readme = "README.md"
requires-python = "^3.11"
dependencies = [
    "papermill (>=2.6.0,<3.0.0)",
    "boto3 (>=1.34.0,<1.35.0)",
    "pyyaml (>=6.0.3,<7.0.0)",
    "gitpython (>=3.1.45,<4.0.0)",
    "s3fs (>=2025.10.0)",
    "fsspec (>=2025.10.0)",
    "ipykernel (>=6.29.0,<7.0.0)"
]

[tool.poetry.group.dev.dependencies]
pytest = "^7.4.0"
moto = "^4.2.0"


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
