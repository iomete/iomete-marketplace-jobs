[project]
name = "jupyter-notebook-scheduler"
version = "0.1.0"
description = "Spark job to schedule and execute Jupyter Notebooks"
authors = [
    {name = "IOMETE"}
]
package-mode = false
readme = "README.md"
requires-python = "^3.11"
dependencies = [
    "jupyter-server (>=2.14.0,<3.0.0)",
    "nbclient (>=0.10.0,<1.0.0)",
    "nbformat (>=5.10.0,<6.0.0)",
    "websocket-client (>=1.8.0,<2.0.0)",
    "pyyaml (>=6.0.3,<7.0.0)",
    "gitpython (>=3.1.45,<4.0.0)",
    "s3fs (>=2025.10.0)",
    "fsspec (>=2025.10.0)",
    "setuptools (>=70.0.0)",
]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
