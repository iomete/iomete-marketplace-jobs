{
    # Namespace Migration Configuration
    # This configuration is specifically for namespace-based permission migration
    # For asset migration, use application.conf

    # Database configuration - will be overridden by environment variables
    databases: {
      bundle_db: {
        host: "localhost"
        port: 5432
        name: "iomete_iam_db"
        user: ${?DB_USER}
        password: ${?DB_PASSWORD}
        ssl_mode: "disable"  # For local development
      }

      # Asset database for resource queries
      asset_db: {
        host: "localhost"
        port: 5432
        name: "iomete_core_db"
        user: ${?ASSET_DB_USER}
        password: ${?ASSET_DB_PASSWORD}
        ssl_mode: "disable"  # For local development
      }
    }

    # Migration configuration for namespace-based permissions
    migration: {
        # Migration type: MUST be "namespace" for this config
        migration_type: "namespace"

        # List of domains to migrate (simple string list for namespace migration)
        # Users will get namespace permissions based on their resource usage
        domains: ["id-abc"]

        # Alternative format - domain objects (both formats supported)
        # domains: [
        #     { domain_id: "default" },
        #     { domain_id: "production" },
        #     { domain_id: "staging" }
        # ]

        # Debug mode - enables detailed logging and query output
        debug_mode: true

        # Dry run mode - rolls back all changes (for testing)
        dry_run: false

        # Duplicate bundle behavior: FAIL, SKIP, or UPDATE
        # FAIL: Stop execution if namespace bundle already exists
        # SKIP: Skip domains where namespace bundle already exists
        # OVERWRITE: OVERWRITE existing bundle where namespace bundle already exists
        duplicate_bundle_action: "OVERWRITE"

        # Resource tables to scan for namespace usage
        # Users found in these tables get permissions on their namespace
        resource_tables: [
            {
                table: "lakehouse"
                namespace_column: "namespace"
                user_columns: ["created_by", "updated_by"]
            },
            {
                table: "spark_job",
                namespace_column: "namespace",
                user_columns: ["created_by", "job_user"]
            }
        ]

        # Permissions to grant to users on namespaces they use
        # Common options: ["USE"], ["READ", "WRITE"], ["READ", "WRITE", "EXECUTE"]
        namespace_permissions: ["VIEW"]
    }

    # Namespace configuration - defines how to query namespace information
    namespace_config: {
        table: "domain_namespace_mapping"
        id_column: "id"
        namespace_column: "namespace"
        domain_column: "domain_id"
    }
}
