{
    # Unified Configuration for RAS Onboarding Migration
    # Supports both asset-based and namespace-based permission migration
    # Set migration_type to "namespace" or "asset" to control behavior

    # Database configuration - will be overridden by environment variables
    databases: {
      # IAM database - used for bundle operations
      iam_db: {
        host: "localhost"
        port: 5432
        name: "iomete_iam_db"
        user: ${?DB_USER}
        password: ${?DB_PASSWORD}
        ssl_mode: "disable"
      }

      # Core database - used for resource queries
      core_db: {
        host: "localhost"
        port: 5432
        name: "iomete_core_db"
        user: ${?ASSET_DB_USER}
        password: ${?ASSET_DB_PASSWORD}
        ssl_mode: "disable"
      }
    }

    # Migration configuration
    migration: {
        # Migration type: "namespace" or "asset"
        migration_type: "namespace"

        # List of domains to migrate
        # For namespace migration: simple string list
        # For asset migration: list of objects with domain_id, owner_id, owner_type, asset_types
        domains: ["mg-test"]

        # Transaction settings
        batch_size: 1000
        retry_attempts: 3

        # Validation settings
        validate_before_migration: true
        dry_run: false

        # Debug mode - enables detailed logging and query output
        debug_mode: false

        # Duplicate bundle behavior: FAIL, SKIP, UPDATE, or OVERWRITE
        # FAIL: Stop execution if bundle already exists (default behavior)
        # SKIP: Skip migration for domains where bundle already exists
        # UPDATE: Update existing bundle ownership and re-process assets/permissions
        # OVERWRITE: Delete and recreate existing bundle
        duplicate_bundle_action: "UPDATE"

        # Permissions to grant to users on namespaces (for namespace migration)
        namespace_permissions: ["USE"]
    }

    # Namespace configuration - defines how to query namespace information
    # Do not change this before consulting Iomete support
    namespace_config: {
        table: "domain_namespace_mapping"
        id_column: "id"
        namespace_column: "namespace"
        domain_column: "domain_id"
    }

    # INTERNAL USE ONLY: Do not edit or change the below CONFIGS WITHOUT CHECKING WITH SUPPORT FIRST
    # Asset type mappings - defines how to query assets for each type (for asset migration)
    asset_mappings: {
        COMPUTE: {
            table: "lakehouse"
            id_column: "id"
            domain_column: "domain"
            filter_condition: "is_deleted = false"
            service: "lakehouse"
            permission_mappings: {
                list: ["VIEW"]
                view: ["VIEW"]
                manage: ["UPDATE", "DELETE", "EXECUTE", "CONSUME"]
            }
            # Action when asset already exists in bundle: SKIP, UPDATE, ERROR, or RESET
            # SKIP: Skip assets that already exist in the bundle
            # UPDATE: Add new assets, merge permissions for existing ones
            # ERROR: Raise error if any asset already exists
            # RESET: Clear all assets and permissions for this asset type before migration
            asset_action_on_duplicate: "UPDATE"
        }
        SPARK_JOB: {
            table: "spark_job"
            id_column: "id"
            domain_column: "domain"
            filter_condition: "is_deleted = false"
            service: "spark_job"
            permission_mappings: {
                list: ["VIEW"]
                view: ["VIEW"]
                manage: ["UPDATE", "DELETE", "RUN", "CONSUME"]
            }
            # Action when asset already exists in bundle: SKIP, UPDATE, ERROR, or RESET
            # SKIP: Skip assets that already exist in the bundle
            # UPDATE: Add new assets, merge permissions for existing ones
            # ERROR: Raise error if any asset already exists
            # RESET: Clear all assets and permissions for this asset type before migration
            asset_action_on_duplicate: "UPDATE"
        },
        JUPYTER_CONTAINER: {
            table: "jupyter_container"
            id_column: "id"
            domain_column: "domain"
            filter_condition: "is_deleted = false"
            service: "jupyter_container"
            permission_mappings: {
                all : ["VIEW", "UPDATE", "DELETE", "RUN"]
            }
            # Action when asset already exists in bundle: SKIP, UPDATE, ERROR, or RESET
            # SKIP: Skip assets that already exist in the bundle
            # UPDATE: Add new assets, merge permissions for existing ones
            # ERROR: Raise error if any asset already exists
            # RESET: Clear all assets and permissions for this asset type before migration
            asset_action_on_duplicate: "UPDATE"
        }
    }
}
