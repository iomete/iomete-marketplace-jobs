[metadata]
name = ras-onboarding
version = 1.0.0
author = IOMETE Team
author_email = dev@iomete.com
description = iomete: Asset RAS Onboarding Migration Job
long_description = file: README.md
long_description_content_type = text/markdown
keywords = ras_onboarding
license = Apache License 2.0
classifiers =
    Programming Language :: Python :: 3

[options]
packages = find:
install_requires =
    pyhocon==0.3.59
    requests==2.34.2
    psycopg2-binary==2.9.12

[options.extras_require]
dev =
    pyspark==3.5.9
    pytest==7.1.2

[pycodestyle]
max_line_length = 150