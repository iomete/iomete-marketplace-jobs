name: Catalog Sync Unit Tests

on:
  push:
    branches: [main]
    paths:
      - 'iomete-catalog-sync/**'
  pull_request:
    branches: [main]
    paths:
      - 'iomete-catalog-sync/**'

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: iomete-catalog-sync

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('iomete-catalog-sync/**/*.gradle*', 'iomete-catalog-sync/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run unit tests
        run: ./gradlew test

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: iomete-catalog-sync/build/reports/tests/test/
          retention-days: 7