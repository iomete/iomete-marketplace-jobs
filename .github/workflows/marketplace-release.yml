name: Marketplace release

# Asks the release pipeline to release every job whose VERSION is not released
# yet. The pipeline reads main itself, so this only says "look now".
#
# The token can do nothing but start that release (iomete/infra
# argo-workflows/templates/rbac/iom-marketplace-release.yaml). It and the server
# host live in the marketplace-release environment, which only main can use,
# and nothing the step prints names the server.
on:
  push:
    branches: [main]
    paths:
      - '**/VERSION'
      - marketplace-jobs.json
  workflow_dispatch:

permissions: {}

concurrency:
  group: marketplace-release
  cancel-in-progress: false

jobs:
  trigger:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: marketplace-release
    steps:
      - name: Start the release
        env:
          ARGO_HOST: ${{ secrets.ARGO_HOST }}
          ARGO_TOKEN: ${{ secrets.ARGO_TOKEN }}
        run: |
          set -u
          status=$(curl -s -o /dev/null -w '%{http_code}' --max-time 60 -X POST \
            "https://${ARGO_HOST}/api/v1/workflows/argo/submit" \
            -H "Authorization: Bearer ${ARGO_TOKEN}" \
            -H "Content-Type: application/json" \
            -d '{"resourceKind":"WorkflowTemplate","resourceName":"iom-release-marketplace"}' || true)
          if [ "$status" != "200" ]; then
            echo "::error::Release request failed (HTTP ${status:-none})"
            exit 1
          fi
          echo "Release started. Released versions are tagged <job>/<version> when they finish."
