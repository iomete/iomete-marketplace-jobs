name: Cleanup Untracked Table Folders Tests

on:
  push:
    branches: [main]
    paths:
      - 'cleanup-untracked-table-folders-job/**'
      - '.github/workflows/cleanup_untracked_table_folders_tests.yml'
  pull_request:
    branches: [main]
    paths:
      - 'cleanup-untracked-table-folders-job/**'
      - '.github/workflows/cleanup_untracked_table_folders_tests.yml'
  workflow_call:

concurrency:
  group: cleanup-untracked-table-folders-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
    defaults:
      run:
        working-directory: cleanup-untracked-table-folders-job

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK 17
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Cache Gradle packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('cleanup-untracked-table-folders-job/**/*.gradle*', 'cleanup-untracked-table-folders-job/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run unit tests
        run: ./gradlew test

      - name: Build runner jar
        run: ./gradlew quarkusBuild

      - name: Publish test report
        if: always()
        uses: mikepenz/action-junit-report@6ef3fdcfcd5f0b5d14df3e659ef19b8c6820f93d # v6.6.1
        with:
          report_paths: 'cleanup-untracked-table-folders-job/build/test-results/**/*.xml'
          detailed_summary: true

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cleanup-untracked-table-folders-test-reports
          path: cleanup-untracked-table-folders-job/build/reports/tests/test/
          retention-days: 3
