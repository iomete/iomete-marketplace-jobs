[metadata]
name = orphaned-asset-detection
version = 1.0.0
author = IOMETE Team
author_email = dev@iomete.com
description = iomete: Orphaned Asset Detection Job
long_description = file: README.md
long_description_content_type = text/markdown
keywords = orphaned_asset_detection
license = Apache License 2.0
classifiers =
    Programming Language :: Python :: 3

[options]
packages = find:
install_requires =
    pyhocon==0.3.63

[options.extras_require]
dev =
    pyspark==3.5.9
    pytest==9.1.1

[pycodestyle]
max_line_length = 150
