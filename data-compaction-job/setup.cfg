[metadata]
name = data_compaction_job
version = 1.2.8
author = Fuad M.
author_email = fuad@iomete.com
description = iomete: Data Compaction Job
long_description = file: readme.md
long_description_content_type = text/markdown
keywords = data_compaction_job
license = Apache License 2.0
classifiers =
    Programming Language :: Python :: 3

[options]
package_dir =
    = data_compaction_job
install_requires =
    pyhocon==0.3.63
    requests==2.34.2

[options.extras_require]
dev =
    pyspark==4.2.0
    pytest==9.1.1

    # PySpark dependencies
    pandas==3.0.5
    pyarrow==25.0.1

    # Spark Connect dependencies
    grpcio==1.83.1
    googleapis-common-protos==1.75.3
    grpcio-status==1.83.1

    # Only required for python version >= 3.12
    setuptools==84.0.0

[pycodestyle]
max_line_length = 150
