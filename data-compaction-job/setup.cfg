[metadata]
name = data_compaction_job
version = 1.2.8
author = Fuad M.
author_email = fuad@iomete.com
description = iomete: Data Compaction Job
long_description = file: readme.md
long_description_content_type = text/markdown
keywords = data_compaction_job
license = Apache License 2.0
classifiers =
    Programming Language :: Python :: 3

[options]
package_dir =
    = data_compaction_job
install_requires =
    pyhocon==0.3.59
    requests==2.32.5

[options.extras_require]
dev =
    pyspark==4.0.1
    pytest==7.1.2

    # PySpark dependencies
    pandas==2.2.3
    pyarrow==18.0.0

    # Spark Connect dependencies
    grpcio==1.67.1
    googleapis-common-protos==1.65.0
    grpcio-status==1.67.1

    # Only required for python version >= 3.12
    setuptools==75.3.0

[pycodestyle]
max_line_length = 150
