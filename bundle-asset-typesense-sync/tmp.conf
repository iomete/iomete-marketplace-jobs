
bundle_asset_typesense_sync {
  db {
    host = "db-host"
    port = 5433
    user = "db-user"
    password = "db-pass"
    name = "iam_db"
  }
  cluster_service {
    base_url = "http://cluster.local"
    token = "cluster-token"
  }
  sql_service {
    base_url = "http://sql.local"
    token = "sql-token"
  }
  typesense {
    base_url = "http://typesense.local"
    api_key = "typesense-key"
    collection = "bundle_assets"
    timeout_seconds = 5.0
  }
  batch_size = 200
  http_timeout_seconds = 2.5
}
